<div style="max-width: 450px; margin: 30px auto; font-family: sans-serif;">
  <div *ngIf="successMessage" style="background-color: #d4edda; color: #155724; padding: 10px; border-radius: 4px; margin-bottom: 15px;">
    {{ successMessage }}
  </div>

  <h2>Sign Up (Angular)</h2>

  <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
    <div style="margin-bottom: 15px;">
      <label>Full Name</label><br />
      <input type="text" formControlName="name" style="width: 100%; padding: 8px; box-sizing: border-box;" />
      <div *ngIf="submitted && f['name'].errors" style="color: red; font-size: 0.85em;">
        <span *ngIf="f['name'].errors['required']">Name is required.</span>
      </div>
    </div>

    <div style="margin-bottom: 15px;">
      <label>Email</label><br />
      <input type="email" formControlName="email" style="width: 100%; padding: 8px; box-sizing: border-box;" />
      <div *ngIf="submitted && f['email'].errors" style="color: red; font-size: 0.85em;">
        <span *ngIf="f['email'].errors['required']">Email is required.</span>
        <span *ngIf="f['email'].errors['email']">Enter a valid email address.</span>
      </div>
    </div>

    <div style="margin-bottom: 15px;">
      <label>Password</label><br />
      <input type="password" formControlName="password" style="width: 100%; padding: 8px; box-sizing: border-box;" />
      <div *ngIf="submitted && f['password'].errors" style="color: red; font-size: 0.85em;">
        <span *ngIf="f['password'].errors['required']">Password is required.</span>
        <span *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters.</span>
      </div>
    </div>

    <button type="submit" style="padding: 10px 20px; background-color: #0d6efd; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Register
    </button>
  </form>
</div>
